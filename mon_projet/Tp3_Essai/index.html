<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Qualité de vie à Montréal</title>

  <!-- Google Font Inter -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <!-- Ta CSS -->
  <link rel="stylesheet" href="app.css" />

  <!-- MapLibre CSS -->
  <link
    href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css"
    rel="stylesheet"
  />
</head>
<body>
  <!-- Backdrop pour lorsque la sidebar est ouverte -->
  <div id="sidebarBackdrop"></div>

  <!-- Sidebar (initialement masquée) -->
  <div id="sidebar" class="collapsed">
    <!-- Toggle INSIDE the sidebar -->
    <button id="toggleSidebar" class="sidebar-toggle">☰</button>

    <h3>Critères</h3>
    <form id="criteriaForm">
      <label><input type="checkbox" class="criterion" value="nbr_poste_police"> Police</label>
      <label><input type="checkbox" class="criterion" value="Nbr_crimes"> Crimes</label>
      <label><input type="checkbox" class="criterion" value="Nbr_Caserne_pompier"> Pompiers</label>
      <label><input type="checkbox" class="criterion" value="Nbr_hopitaux"> Hôpitaux</label>
      <label><input type="checkbox" class="criterion" value="Nbr_college"> Collèges</label>
      <label><input type="checkbox" class="criterion" value="Nbr_université"> Universités</label>
      <label><input type="checkbox" class="criterion" value="nbr_resto_commerces"> Commerces</label>
      <label><input type="checkbox" class="criterion" value="Nbr_Arret_STM"> STM</label>
      <label><input type="checkbox" class="criterion" value="Nbr_parc"> Parcs</label>
    </form>

    <button id="loadHexGrid">📥 Charger Hexagones</button>
    <button id="calculateScore">🎯 Calculer le score</button>
    <hr/>
    <button id="toggleArrondissements">🗺 Arrondissements</button>
  </div>

  <!-- La carte -->
  <div id="map"></div>

  <!-- Panneau d’info -->
  <div id="info">Score : <span id="scoreValue">-</span>/7</div>

  <!-- Scripts -->
  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
