<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Qualité de vie à Montréal</title>

  <!-- Google Font Inter -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <!-- Ta CSS -->
  <link rel="stylesheet" href="app.css" />

  <!-- MapLibre CSS -->
  <link
    href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css"
    rel="stylesheet"
  />
</head>
<body>
  <!-- Backdrop pour lorsque la sidebar est ouverte -->
  <div id="sidebarBackdrop"></div>

  <!-- Sidebar (initialement masquée) -->
  <div id="sidebar" class="collapsed">
    <!-- Toggle INSIDE the sidebar -->
    <button id="toggleSidebar" class="sidebar-toggle">☰</button>

    <h3>Je souhaite :</h3>
    <form id="criteriaForm">
      <label><input type="checkbox" class="criterion" value="nbr_poste_police"> un poste de police </label>
      <label><input type="checkbox" class="criterion" value="Nbr_crimes"> un taux criminalité bas </label>
      <label><input type="checkbox" class="criterion" value="Nbr_Caserne_pompier"> une caserne de pompiers</label>
      <label><input type="checkbox" class="criterion" value="Nbr_hopitaux">  un hopital </label>
      <label><input type="checkbox" class="criterion" value="Nbr_college"> Des collèges</label>
      <label><input type="checkbox" class="criterion" value="Nbr_université"> Des universités</label>
      <label><input type="checkbox" class="criterion" value="nbr_resto_commerces"> Des commerces</label>
      <label><input type="checkbox" class="criterion" value="Nbr_Arret_STM"> Transport en commun (STM) </label>
      <label><input type="checkbox" class="criterion" value="Nbr_parc"> Des parcs et la verdure </label>
    </form>

    <button id="loadHexGrid">📥 Charger Hexagones</button>
    <button id="calculateScore">🎯 Calculer le score</button>
    <hr/>
    <button id="toggleArrondissements">🗺 Arrondissements</button>
  </div>

  <!-- La carte -->
  <div id="map"></div>

  <div id="appHeader">
    <h1>Montréal à la carte</h1>
    <h2>Trouve le meilleur quartier selon tes critères</h2>
  </div>
  <!-- Panneau d’info -->
  <div id="info">Score : <span id="scoreValue">-</span>/7</div>

  <!-- Scripts -->
  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
