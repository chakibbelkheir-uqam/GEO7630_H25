<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Affichage GeoJSON - LAB 9</title>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        #map {
            width: 100%;
            height: 90%;
        }
        #controls {
            height: 10%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: #f0f0f0;
            padding: 10px;
        }
        button {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
        }
        input[type="file"] {
            padding: 5px;
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="controls">
    <input type="file" id="file" accept=".geojson,application/geo+json" />
    <button id="zoomto">Zoom vers les polygones</button>
    <button id="colorier">Colorier par operator_id</button>
</div>

<script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/geojson-extent/geojson-extent.js"></script>
<script src="lab9.js"></script>
<script src="randomColor.js"></script>

</body>
</html>
